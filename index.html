<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web gMKVExtractGUI Pro</title>
    
    <!-- Library Eksternal -->
    <script src="https://cdn.jsdelivr.net/npm/matroska-subtitles@3.x/dist/matroska-subtitles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-body: #141417;
            --bg-card: #1e1e24;
            --bg-item: #282830;
            --bg-item-hover: #32323c;
            --text-main: #f0f0f5;
            --text-muted: #9595a6;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #383844;
            --badge-video: #3b82f6;
            --badge-audio: #10b981;
            --badge-sub: #f59e0b;
            --badge-font: #ec4899;
            --menu-bg: #22222a;
            --menu-hover: #3f3f50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 950px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        header h2 { font-size: 1.6rem; margin-bottom: 4px; }
        header p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
        }

        .btn {
            background-color: var(--bg-item);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            user-select: none;
        }
        .btn:hover { background-color: var(--bg-item-hover); border-color: var(--accent); }
        .btn-primary { background-color: var(--accent); border-color: var(--accent); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }

        .status-bar {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Area TreeView + Drag & Drop */
        .tree-container {
            border: 2px dashed var(--border);
            border-radius: 8px;
            background: #18181c;
            min-height: 280px;
            max-height: 480px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 15px;
            transition: all 0.2s ease;
            position: relative;
        }
        .tree-container.drag-over {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .drop-hint {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            pointer-events: none;
            gap: 8px;
        }

        .file-node {
            margin-bottom: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }
        .file-header {
            padding: 10px 12px;
            background: var(--bg-item);
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 10px;
            user-select: none;
        }
        .file-header:hover { background: var(--bg-item-hover); }
        .file-header .toggle-icon { font-size: 0.75rem; transition: transform 0.2s; }
        .file-header.collapsed .toggle-icon { transform: rotate(-90deg); }
        .file-title { font-size: 0.9rem; font-weight: 600; flex-grow: 1; word-break: break-all; }
        .file-badge { font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; }

        .track-list { padding: 5px 10px 10px 32px; }
        .file-header.collapsed + .track-list { display: none; }

        .track-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            font-size: 0.85rem;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
        .track-item:last-child { border-bottom: none; }
        .track-item input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; }

        .type-badge {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-video { background: var(--badge-video); color: white; }
        .badge-audio { background: var(--badge-audio); color: white; }
        .badge-sub { background: var(--badge-sub); color: black; }
        .badge-font { background: var(--badge-font); color: white; }

        .log-box {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            height: 120px;
            overflow-y: auto;
            color: #10b981;
        }

        /* Overlay Backdrop Khusus Mobile */
        .menu-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 9999;
            backdrop-filter: blur(2px);
        }

        /* ========================================================
           SISTEM MENU HYBRID (DESKTOP FLYOUT vs MOBILE AKORDEON)
           ======================================================== */
        .g-menu {
            display: none;
            background: var(--menu-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.85);
            z-index: 10000;
            padding: 6px 0;
            font-size: 0.85rem;
            user-select: none;
        }

        .g-item {
            position: relative;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
            gap: 15px;
        }
        .g-item:hover { background-color: var(--accent); color: white; }
        .g-item.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
        .g-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 5px 0; }

        .g-item.has-sub::after {
            content: '▸';
            font-size: 0.85rem;
            margin-left: auto;
            transition: transform 0.2s ease;
        }

        /* --- 1. DESKTOP MODE (Lebar > 768px): Flyout Bebas Bug --- */
        @media (min-width: 769px) {
            .g-menu {
                position: absolute;
                min-width: 260px;
            }
            .g-submenu {
                display: none;
                position: absolute;
                left: 100%;
                top: -6px;
                background: var(--menu-bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                min-width: 250px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.85);
                padding: 6px 0;
                z-index: 10001;
            }
            /* Submenu ujung yang berisi banyak opsi bahasa bisa di-scroll tanpa mengganggu flyout */
            .g-submenu.leaf-menu {
                max-height: 320px;
                overflow-y: auto;
            }
            .g-item:hover > .g-submenu {
                display: block;
            }
        }

        /* --- 2. MOBILE MODE (Lebar <= 768px): Akordeon Mekar ke Bawah --- */
        @media (max-width: 768px) {
            .app-container { padding: 12px; }
            .toolbar { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
            .track-list { padding-left: 15px; }

            .g-menu {
                position: fixed !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                width: 92% !important;
                max-width: 420px !important;
                max-height: 82vh !important;
                overflow-y: auto !important;
                border-radius: 12px !important;
            }

            .mobile-header {
                display: flex !important;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                font-weight: bold;
                border-bottom: 1px solid var(--border);
                color: var(--accent);
            }

            /* Submenu menjadi blok akordeon mekar ke bawah */
            .g-submenu {
                display: none;
                position: static !important;
                background: rgba(0, 0, 0, 0.25) !important;
                border: none !important;
                border-left: 3px solid var(--accent) !important;
                box-shadow: none !important;
                padding: 2px 0 2px 10px !important;
                width: 100% !important;
            }

            /* Submenu tingkat 3 aksen warna pink */
            .g-submenu .g-submenu {
                border-left-color: #ec4899 !important;
            }

            /* Kondisi terbuka saat di-tap */
            .g-item.expanded > .g-submenu {
                display: block !important;
            }

            /* Panah berputar ke bawah saat mekar */
            .g-item.expanded.has-sub::after {
                transform: rotate(90deg) !important;
            }
        }
    </style>
</head>
<body>

    <div class="menu-backdrop" id="menuBackdrop"></div>

    <div class="app-container">
        <header>
            <h2>Web gMKVExtractGUI Pro</h2>
            <p>Pindai, seleksi track cerdas, dan ekstrak sub/font MKV secara batch.</p>
        </header>

        <div class="toolbar">
            <div class="file-input-wrapper">
                <button class="btn btn-primary">📁 Tambah File MKV...</button>
                <input type="file" id="filePicker" multiple />
            </div>

            <!-- Tombol Seleksi Menu Lengkap -->
            <button class="btn" id="btnBatchMenu">⚡ Menu Seleksi Tracks ▾</button>

            <button class="btn" onclick="expandAllFolders()">📂 Expand All</button>
            <button class="btn" onclick="collapseAllFolders()">📁 Collapse All</button>
            <button class="btn" onclick="clearAllFiles()" style="margin-left: auto;">🗑️ Kosongkan</button>
        </div>

        <div class="status-bar">
            <span>Total MKV: <b id="lblTotalFiles">0</b> File</span>
            <span>Sub: <b id="lblSelectedSubs">0</b> / <span id="lblTotalSubs">0</span></span>
            <span>Font: <b id="lblSelectedFonts">0</b> / <span id="lblTotalFonts">0</span></span>
            <span>Total Centang: <b id="lblTotalChecked">0</b> / <span id="lblTotalAll">0</span></span>
        </div>

        <!-- Wadah TreeView (Drag & Drop + Klik Kanan) -->
        <div class="tree-container" id="treeView">
            <div class="drop-hint" id="emptyHint">
                <span style="font-size: 2.2rem;">📥</span>
                <span>Tarik & lepas (drag and drop) file MKV ke sini</span>
                <small style="color: var(--text-muted);">(atau klik tombol Tambah File MKV di atas)</small>
            </div>
        </div>

        <button class="btn btn-primary" id="btnExtract" style="width: 100%; padding: 14px; font-size: 1rem;" disabled onclick="startExtraction()">
            🚀 Mulai Ekstrak Item Terpilih (ZIP)
        </button>

        <h4 style="margin-top: 15px; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-muted);">Terminal Log:</h4>
        <div class="log-box" id="logBox">Menunggu antrean...</div>
    </div>

    <!-- Master Menu Pop-Up -->
    <div id="masterMenu" class="g-menu"></div>

    <script>
        let mkvDatabase = []; 

        const filePicker = document.getElementById('filePicker');
        const treeView = document.getElementById('treeView');
        const emptyHint = document.getElementById('emptyHint');
        const logBox = document.getElementById('logBox');
        const btnExtract = document.getElementById('btnExtract');
        const masterMenu = document.getElementById('masterMenu');
        const menuBackdrop = document.getElementById('menuBackdrop');
        const btnBatchMenu = document.getElementById('btnBatchMenu');

        function writeLog(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function formatTimeASS(ms) {
            if (!ms || ms < 0) ms = 0;
            const totalSec = Math.floor(ms / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            const cs = Math.floor((ms % 1000) / 10);
            return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
        }

        function formatTimeSRT(ms) {
            if (!ms || ms < 0) ms = 0;
            let date = new Date(ms);
            let h = String(Math.floor(ms / 3600000)).padStart(2, '0');
            let m = String(date.getUTCMinutes()).padStart(2, '0');
            let s = String(date.getUTCSeconds()).padStart(2, '0');
            let milli = String(date.getUTCMilliseconds()).padStart(3, '0');
            return `${h}:${m}:${s},${milli}`;
        }

        // ==========================================
        // DRAG & DROP LISTENER
        // ==========================================
        ['dragenter', 'dragover'].forEach(eventName => {
            treeView.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                treeView.classList.add('drag-over');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            treeView.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                treeView.classList.remove('drag-over');
            });
        });

        treeView.addEventListener('drop', async (e) => {
            const dt = e.dataTransfer;
            const files = Array.from(dt.files).filter(f => f.name.toLowerCase().endsWith('.mkv'));
            if (files.length === 0) return;
            await handleNewFiles(files);
        });

        filePicker.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.mkv'));
            if (files.length === 0) return;
            await handleNewFiles(files);
            filePicker.value = '';
        });

        async function handleNewFiles(files) {
            writeLog(`Mendeteksi ${files.length} file MKV. Memulai scanning...`);
            emptyHint.style.display = 'none';

            for (let i = 0; i < files.length; i++) {
                writeLog(`Scanning (${i+1}/${files.length}): ${files[i].name}...`);
                await probeMKV(files[i]);
            }

            renderTreeView();
            updateCounters();
        }

        function probeMKV(file) {
            return new Promise(async (resolve) => {
                const parser = new window.MatroskaSubtitles.SubtitleParser();
                
                const fileEntry = {
                    id: 'mkv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    fileRef: file,
                    name: file.name,
                    size: (file.size / (1024 * 1024)).toFixed(1) + ' MB',
                    tracks: [],
                    attachments: []
                };

                parser.once('tracks', (tracks) => {
                    tracks.forEach(t => {
                        const codec = (t.codec || '').toUpperCase();
                        const typeStr = (t.type || '').toLowerCase();
                        
                        let trackType = 'unknown';
                        let isSub = false;

                        if (typeStr.includes('video') || t.type === 1) trackType = 'video';
                        else if (typeStr.includes('audio') || t.type === 2) trackType = 'audio';
                        else if (typeStr.includes('sub') || typeStr === 'ass' || typeStr === 'ssa' || typeStr === 'utf8' || codec.includes('S_TEXT') || codec.includes('ASS')) {
                            trackType = 'sub';
                            isSub = true;
                        }

                        fileEntry.tracks.push({
                            number: t.number,
                            type: trackType,
                            codec: t.codec || (isSub ? 'S_TEXT/ASS' : 'UNKNOWN'),
                            language: t.language || 'und',
                            languageIETF: t.languageIETF || t.language || 'und',
                            name: t.name || '',
                            forced: !!t.forced,
                            header: t.header || '',
                            isExtractable: isSub,
                            checked: isSub
                        });
                    });
                });

                parser.on('file', (att) => {
                    const fn = att.filename || `attachment_${Date.now()}`;
                    const isFont = /\.(ttf|otf|ttc|woff|woff2)$/i.test(fn) || (att.mimeType && att.mimeType.includes('font'));

                    if (!fileEntry.attachments.some(a => a.filename === fn)) {
                        fileEntry.attachments.push({
                            filename: fn,
                            mime: att.mimeType || 'font/ttf',
                            size: att.data ? att.data.byteLength : 0,
                            isFont: isFont,
                            checked: isFont
                        });
                    }
                });

                const stream = file.stream();
                const reader = stream.getReader();
                let bytesRead = 0;
                const maxProbeBytes = Math.min(60 * 1024 * 1024, file.size);

                try {
                    while (bytesRead < maxProbeBytes) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        bytesRead += value.length;
                        parser.write(value);
                    }
                    reader.cancel();
                } catch (err) {}

                mkvDatabase.push(fileEntry);
                resolve();
            });
        }

        function getStats() {
            let s = {
                totalFiles: mkvDatabase.length,
                totalAll: 0,
                totalChecked: 0,
                video: { total: 0, checked: 0, langs: {}, codecs: {}, names: {} },
                audio: { total: 0, checked: 0, langs: {}, codecs: {}, names: {} },
                sub: { total: 0, checked: 0, langs: {}, langsIETF: {}, codecs: {}, names: {}, forcedYes: 0, forcedNo: 0 },
                att: { total: 0, checked: 0, fonts: 0, fontsChecked: 0, nonFonts: 0, nonFontsChecked: 0 }
            };

            mkvDatabase.forEach(f => {
                f.tracks.forEach(t => {
                    s.totalAll++;
                    if (t.checked) s.totalChecked++;

                    const lang = t.language || 'und';
                    const langIETF = t.languageIETF || 'und';
                    const codec = t.codec || 'UNKNOWN';
                    const name = t.name || 'Tanpa Nama';

                    if (t.type === 'video') {
                        s.video.total++;
                        if (t.checked) s.video.checked++;
                        s.video.langs[lang] = (s.video.langs[lang] || 0) + 1;
                        s.video.codecs[codec] = (s.video.codecs[codec] || 0) + 1;
                        s.video.names[name] = (s.video.names[name] || 0) + 1;
                    } else if (t.type === 'audio') {
                        s.audio.total++;
                        if (t.checked) s.audio.checked++;
                        s.audio.langs[lang] = (s.audio.langs[lang] || 0) + 1;
                        s.audio.codecs[codec] = (s.audio.codecs[codec] || 0) + 1;
                        s.audio.names[name] = (s.audio.names[name] || 0) + 1;
                    } else if (t.type === 'sub') {
                        s.sub.total++;
                        if (t.checked) s.sub.checked++;
                        s.sub.langs[lang] = (s.sub.langs[lang] || 0) + 1;
                        s.sub.langsIETF[langIETF] = (s.sub.langsIETF[langIETF] || 0) + 1;
                        s.sub.codecs[codec] = (s.sub.codecs[codec] || 0) + 1;
                        s.sub.names[name] = (s.sub.names[name] || 0) + 1;
                        if (t.forced) s.sub.forcedYes++; else s.sub.forcedNo++;
                    }
                });

                f.attachments.forEach(a => {
                    s.totalAll++;
                    if (a.checked) s.totalChecked++;
                    s.att.total++;
                    if (a.checked) s.att.checked++;
                    if (a.isFont) {
                        s.att.fonts++;
                        if (a.checked) s.att.fontsChecked++;
                    } else {
                        s.att.nonFonts++;
                        if (a.checked) s.att.nonFontsChecked++;
                    }
                });
            });

            return s;
        }

        // ==========================================
        // BUILD STRUKTUR MENU DENGAN LABEL "SUB"
        // ==========================================
        function buildMenuHTML(stats) {
            const hasFiles = stats.totalFiles > 0;
            const disabledClass = hasFiles ? '' : 'disabled';

            const subLangItems = Object.entries(stats.sub.langs).map(([k, v]) => 
                `<div class="g-item" onclick="onMenuAction('sub', 'lang', '${k}', true)">[${k}] (${v})</div>`
            ).join('') || `<div class="g-item disabled">(Kosong)</div>`;

            const subLangIETFItems = Object.entries(stats.sub.langsIETF).map(([k, v]) => 
                `<div class="g-item" onclick="onMenuAction('sub', 'langIETF', '${k}', true)">[${k}] (${v})</div>`
            ).join('') || `<div class="g-item disabled">(Kosong)</div>`;

            const subCodecItems = Object.entries(stats.sub.codecs).map(([k, v]) => 
                `<div class="g-item" onclick="onMenuAction('sub', 'codec', '${k}', true)">[${k}] (${v})</div>`
            ).join('') || `<div class="g-item disabled">(Kosong)</div>`;

            const subNameItems = Object.entries(stats.sub.names).map(([k, v]) => 
                `<div class="g-item" onclick="onMenuAction('sub', 'name', '${k}', true)">${k} (${v})</div>`
            ).join('') || `<div class="g-item disabled">(Kosong)</div>`;

            return `
                <div class="mobile-header" style="display: none;">
                    <span>⚡ Menu Seleksi Tracks</span>
                    <span style="cursor: pointer;" onclick="closeMasterMenu()">✕ Tutup</span>
                </div>

                <div class="g-item" onclick="filePicker.click(); closeMasterMenu();">Add Input File(s)...</div>
                <div class="g-divider"></div>

                <div class="g-item ${disabledClass}" onclick="onMenuAction('all', 'all', '', true)">
                    Check All Tracks (${stats.totalChecked}/${stats.totalAll})
                </div>

                <!-- Video -->
                <div class="g-item has-sub ${disabledClass}" onclick="toggleMobileItem(this, event)">
                    <span>Check Video Tracks... (${stats.video.checked}/${stats.video.total})</span>
                    <div class="g-submenu">
                        <div class="g-item" onclick="onMenuAction('video', 'all', '', true)">All Video Tracks (${stats.video.total})</div>
                    </div>
                </div>

                <!-- Audio -->
                <div class="g-item has-sub ${disabledClass}" onclick="toggleMobileItem(this, event)">
                    <span>Check Audio Tracks... (${stats.audio.checked}/${stats.audio.total})</span>
                    <div class="g-submenu">
                        <div class="g-item" onclick="onMenuAction('audio', 'all', '', true)">All Audio Tracks (${stats.audio.total})</div>
                    </div>
                </div>

                <!-- Sub Tracks (Submenu Lengkap) -->
                <div class="g-item has-sub ${disabledClass}" onclick="toggleMobileItem(this, event)">
                    <span>Check Sub Tracks... (${stats.sub.checked}/${stats.sub.total})</span>
                    <div class="g-submenu">
                        <div class="g-item" onclick="onMenuAction('sub', 'all', '', true)">All Sub Tracks (${stats.sub.total})</div>
                        
                        <div class="g-item has-sub" onclick="toggleMobileItem(this, event)">
                            <span>Sub Tracks by Language (${Object.keys(stats.sub.langs).length})...</span>
                            <div class="g-submenu leaf-menu">${subLangItems}</div>
                        </div>

                        <div class="g-item has-sub" onclick="toggleMobileItem(this, event)">
                            <span>Sub Tracks by Language IETF (${Object.keys(stats.sub.langsIETF).length})...</span>
                            <div class="g-submenu leaf-menu">${subLangIETFItems}</div>
                        </div>

                        <div class="g-item has-sub" onclick="toggleMobileItem(this, event)">
                            <span>Sub Tracks by Codec (${Object.keys(stats.sub.codecs).length})...</span>
                            <div class="g-submenu leaf-menu">${subCodecItems}</div>
                        </div>

                        <div class="g-item has-sub" onclick="toggleMobileItem(this, event)">
                            <span>Sub Tracks by Track Name (${Object.keys(stats.sub.names).length})...</span>
                            <div class="g-submenu leaf-menu">${subNameItems}</div>
                        </div>

                        <div class="g-item has-sub" onclick="toggleMobileItem(this, event)">
                            <span>Sub Tracks by Forced...</span>
                            <div class="g-submenu">
                                <div class="g-item" onclick="onMenuAction('sub', 'forced', true, true)">Forced: Yes (${stats.sub.forcedYes})</div>
                                <div class="g-item" onclick="onMenuAction('sub', 'forced', false, true)">Forced: No (${stats.sub.forcedNo})</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="g-item disabled">
                    <span>Check Chapter Tracks... (0/0)</span>
                </div>

                <!-- Attachment Tracks -->
                <div class="g-item has-sub ${disabledClass}" onclick="toggleMobileItem(this, event)">
                    <span>Check Attachment Tracks... (${stats.att.checked}/${stats.att.total})</span>
                    <div class="g-submenu">
                        <div class="g-item" onclick="onMenuAction('att', 'all', '', true)">All Attachment Tracks (${stats.att.total})</div>
                        <div class="g-item" onclick="onMenuAction('att', 'font', '', true)">Font Attachments (${stats.att.fonts})</div>
                        <div class="g-item" onclick="onMenuAction('att', 'nonFont', '', true)">Non-Font Attachments (${stats.att.nonFonts})</div>
                    </div>
                </div>

                <div class="g-divider"></div>

                <!-- Bagian Uncheck -->
                <div class="g-item ${disabledClass}" onclick="onMenuAction('all', 'all', '', false)">
                    Uncheck All Tracks (${stats.totalChecked}/${stats.totalAll})
                </div>
                <div class="g-item ${disabledClass}" onclick="onMenuAction('sub', 'all', '', false)">
                    Uncheck Sub Tracks... (${stats.sub.checked}/${stats.sub.total})
                </div>
                <div class="g-item ${disabledClass}" onclick="onMenuAction('att', 'all', '', false)">
                    Uncheck Attachment Tracks... (${stats.att.checked}/${stats.att.total})
                </div>

                <div class="g-divider"></div>
                <div class="g-item ${disabledClass}" onclick="clearAllFiles()">Remove All Input Files (${stats.totalFiles})</div>
                <div class="g-divider"></div>
                <div class="g-item ${disabledClass}" onclick="expandAllFolders(); closeMasterMenu();">Expand All</div>
                <div class="g-item ${disabledClass}" onclick="collapseAllFolders(); closeMasterMenu();">Collapse All</div>
            `;
        }

        // Penanganan klik item akordeon khusus mobile
        function toggleMobileItem(el, e) {
            if (window.innerWidth <= 768) {
                e.stopPropagation();
                el.classList.toggle('expanded');
            }
        }

        function onMenuAction(type, filterKey, filterVal, state) {
            applyCheck(type, filterKey, filterVal, state);
        }

        function applyCheck(type, filterKey, filterVal, state) {
            mkvDatabase.forEach(file => {
                file.tracks.forEach(t => {
                    let match = false;
                    if (type === 'all') match = true;
                    else if (type === t.type) {
                        if (filterKey === 'all') match = true;
                        else if (filterKey === 'lang' && (t.language || 'und') === filterVal) match = true;
                        else if (filterKey === 'langIETF' && (t.languageIETF || 'und') === filterVal) match = true;
                        else if (filterKey === 'codec' && t.codec === filterVal) match = true;
                        else if (filterKey === 'name' && (t.name || 'Tanpa Nama') === filterVal) match = true;
                        else if (filterKey === 'forced' && t.forced === filterVal) match = true;
                    }
                    if (match) t.checked = state;
                });

                file.attachments.forEach(a => {
                    let match = false;
                    if (type === 'all') match = true;
                    else if (type === 'att') {
                        if (filterKey === 'all') match = true;
                        else if (filterKey === 'font' && a.isFont) match = true;
                        else if (filterKey === 'nonFont' && !a.isFont) match = true;
                    }
                    if (match) a.checked = state;
                });
            });

            renderTreeView();
            updateCounters();
            closeMasterMenu();
        }

        function showMenuAt(x, y) {
            masterMenu.innerHTML = buildMenuHTML(getStats());
            masterMenu.style.display = 'block';

            if (window.innerWidth <= 768) {
                // Di layar HP: Buka sebagai modal terpusat
                menuBackdrop.style.display = 'block';
            } else {
                // Di Desktop: Atur posisi koordinat kursor
                menuBackdrop.style.display = 'none';
                const menuRect = masterMenu.getBoundingClientRect();
                if (x + menuRect.width > window.innerWidth) x = window.innerWidth - menuRect.width - 15;
                if (y + menuRect.height > window.innerHeight) y = window.innerHeight - menuRect.height - 15;

                masterMenu.style.left = `${Math.max(10, x)}px`;
                masterMenu.style.top = `${Math.max(10, y)}px`;

                // Deteksi agar flyout desktop tidak menabrak batas layar kanan
                masterMenu.querySelectorAll('.g-item.has-sub').forEach(item => {
                    item.addEventListener('mouseenter', () => {
                        const sub = item.querySelector('.g-submenu');
                        if (sub) {
                            const rect = sub.getBoundingClientRect();
                            if (rect.right > window.innerWidth) {
                                sub.style.left = 'auto';
                                sub.style.right = '100%';
                            } else {
                                sub.style.left = '100%';
                                sub.style.right = 'auto';
                            }
                        }
                    });
                });
            }
        }

        function closeMasterMenu() {
            masterMenu.style.display = 'none';
            menuBackdrop.style.display = 'none';
        }

        treeView.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showMenuAt(e.clientX, e.clientY);
        });

        btnBatchMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = btnBatchMenu.getBoundingClientRect();
            showMenuAt(rect.left, rect.bottom + 5);
        });

        menuBackdrop.addEventListener('click', closeMasterMenu);

        window.addEventListener('click', (e) => {
            if (!masterMenu.contains(e.target) && e.target !== btnBatchMenu) {
                closeMasterMenu();
            }
        });

        // ==========================================
        // RENDER TREEVIEW
        // ==========================================
        function renderTreeView() {
            if (mkvDatabase.length === 0) {
                treeView.innerHTML = '';
                treeView.appendChild(emptyHint);
                emptyHint.style.display = 'flex';
                btnExtract.disabled = true;
                return;
            }

            emptyHint.style.display = 'none';
            treeView.innerHTML = '';
            btnExtract.disabled = false;

            mkvDatabase.forEach((item, fileIdx) => {
                const fileBox = document.createElement('div');
                fileBox.className = 'file-node';

                const checkedCount = item.tracks.filter(t => t.checked).length + item.attachments.filter(a => a.checked).length;
                const totalCount = item.tracks.length + item.attachments.length;

                fileBox.innerHTML = `
                    <div class="file-header" onclick="this.classList.toggle('collapsed')">
                        <span class="toggle-icon">▼</span>
                        <span class="file-title">📁 [${item.name}] (${item.size})</span>
                        <span class="file-badge">${checkedCount}/${totalCount} Terpilih</span>
                    </div>
                    <div class="track-list"></div>
                `;

                const trackListEl = fileBox.querySelector('.track-list');

                item.tracks.forEach((track, trackIdx) => {
                    const row = document.createElement('div');
                    row.className = 'track-item';

                    const badgeClass = track.type === 'sub' ? 'badge-sub' : (track.type === 'audio' ? 'badge-audio' : 'badge-video');
                    const badgeText = track.type === 'sub' ? 'SUB' : track.type.toUpperCase();
                    const nameLabel = track.name ? ` "${track.name}"` : '';
                    const forcedLabel = track.forced ? ' [Forced]' : '';

                    row.innerHTML = `
                        <input type="checkbox" ${track.checked ? 'checked' : ''} onchange="onTrackCheck(${fileIdx}, ${trackIdx}, this.checked)" />
                        <span class="type-badge ${badgeClass}">${badgeText}</span>
                        <span>Track ${track.number} [${track.codec}] [${track.language}]${nameLabel}${forcedLabel}</span>
                    `;
                    trackListEl.appendChild(row);
                });

                item.attachments.forEach((att, attIdx) => {
                    const row = document.createElement('div');
                    row.className = 'track-item';
                    const sizeStr = att.size > 0 ? ` (${(att.size / 1024).toFixed(1)} KB)` : '';
                    row.innerHTML = `
                        <input type="checkbox" ${att.checked ? 'checked' : ''} onchange="onAttCheck(${fileIdx}, ${attIdx}, this.checked)" />
                        <span class="type-badge badge-font">${att.isFont ? 'Font' : 'Attachment'}</span>
                        <span>[${att.filename}]${sizeStr}</span>
                    `;
                    trackListEl.appendChild(row);
                });

                treeView.appendChild(fileBox);
            });
        }

        function onTrackCheck(fIdx, tIdx, isChecked) {
            mkvDatabase[fIdx].tracks[tIdx].checked = isChecked;
            updateCounters();
        }

        function onAttCheck(fIdx, aIdx, isChecked) {
            mkvDatabase[fIdx].attachments[aIdx].checked = isChecked;
            updateCounters();
        }

        function updateCounters() {
            const s = getStats();
            document.getElementById('lblTotalFiles').innerText = s.totalFiles;
            document.getElementById('lblSelectedSubs').innerText = s.sub.checked;
            document.getElementById('lblTotalSubs').innerText = s.sub.total;
            document.getElementById('lblSelectedFonts').innerText = s.att.fontsChecked;
            document.getElementById('lblTotalFonts').innerText = s.att.fonts;
            document.getElementById('lblTotalChecked').innerText = s.totalChecked;
            document.getElementById('lblTotalAll').innerText = s.totalAll;

            const headers = document.querySelectorAll('.file-header');
            mkvDatabase.forEach((item, idx) => {
                if (headers[idx]) {
                    const badge = headers[idx].querySelector('.file-badge');
                    const checked = item.tracks.filter(t => t.checked).length + item.attachments.filter(a => a.checked).length;
                    const total = item.tracks.length + item.attachments.length;
                    if (badge) badge.innerText = `${checked}/${total} Terpilih`;
                }
            });
        }

        function expandAllFolders() {
            document.querySelectorAll('.file-header').forEach(el => el.classList.remove('collapsed'));
        }

        function collapseAllFolders() {
            document.querySelectorAll('.file-header').forEach(el => el.classList.add('collapsed'));
        }

        function clearAllFiles() {
            mkvDatabase = [];
            renderTreeView();
            updateCounters();
            closeMasterMenu();
            writeLog("Seluruh antrean dibersihkan.");
        }

        // ==========================================
        // EKSTRAKSI SUBTITLE & FONT KE ZIP
        // ==========================================
        async function startExtraction() {
            btnExtract.disabled = true;
            const zip = new JSZip();

            writeLog("<b>Memulai ekstraksi batch...</b>");

            for (let i = 0; i < mkvDatabase.length; i++) {
                const item = mkvDatabase[i];
                const activeSubs = item.tracks.filter(t => t.type === 'sub' && t.checked);
                const activeFonts = item.attachments.filter(a => a.checked);
                const nonSubChecked = item.tracks.some(t => t.type !== 'sub' && t.checked);

                if (nonSubChecked) {
                    writeLog(`ℹ️ [Info] Track Video/Audio pada '${item.name}' dilewati karena web fokus pada Sub & Font.`);
                }

                if (activeSubs.length === 0 && activeFonts.length === 0) continue;

                writeLog(`[${i+1}/${mkvDatabase.length}] Memproses: ${item.name}...`);
                await extractSingleMKV(item, zip);
            }

            writeLog("Mengompresi seluruh file ke ZIP...");
            try {
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                const zipUrl = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = zipUrl;
                a.download = `Extracted_MKV_${Date.now()}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(zipUrl);

                writeLog("<b>✅ Ekstraksi selesai! File ZIP berhasil diunduh.</b>");
            } catch (err) {
                writeLog(`❌ Gagal membuat ZIP: ${err.message}`);
            }

            btnExtract.disabled = false;
        }

        function extractSingleMKV(item, zip) {
            return new Promise(async (resolve) => {
                const parser = new window.MatroskaSubtitles.SubtitleParser();
                let subtitleBuffers = {};
                let srtIndexCounter = {};

                const baseName = item.name.replace(/\.[^/.]+$/, '');
                const fontFolder = zip.folder("Fonts");

                item.tracks.forEach(t => {
                    if (t.type === 'sub' && t.checked) {
                        const codec = (t.codec || '').toUpperCase();
                        const isASS = codec.includes('ASS') || codec.includes('SSA');
                        
                        subtitleBuffers[t.number] = isASS 
                            ? (t.header || '[Script Info]\r\nTitle: Extracted Subtitle\r\nScriptType: v4.00+\r\nWrapStyle: 0\r\nScaledBorderAndShadow: yes\r\n\r\n') + '[Events]\r\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\r\n'
                            : '';
                        srtIndexCounter[t.number] = 1;
                    }
                });

                parser.on('subtitle', (sub, trackNo) => {
                    if (subtitleBuffers[trackNo] !== undefined) {
                        const track = item.tracks.find(t => t.number === trackNo);
                        const codec = (track && track.codec ? track.codec : '').toUpperCase();
                        const isASS = codec.includes('ASS') || codec.includes('SSA');

                        if (isASS) {
                            const start = formatTimeASS(sub.time);
                            const end = formatTimeASS((sub.time || 0) + (sub.duration || 0));
                            
                            if (sub.text && sub.text.startsWith('Dialogue:')) {
                                subtitleBuffers[trackNo] += sub.text + '\r\n';
                            } else {
                                subtitleBuffers[trackNo] += `Dialogue: 0,${start},${end},Default,,0,0,0,,${sub.text || ''}\r\n`;
                            }
                        } else {
                            const start = formatTimeSRT(sub.time || 0);
                            const end = formatTimeSRT((sub.time || 0) + (sub.duration || 0));
                            subtitleBuffers[trackNo] += `${srtIndexCounter[trackNo]}\r\n${start} --> ${end}\r\n${sub.text || ''}\r\n\r\n`;
                            srtIndexCounter[trackNo]++;
                        }
                    }
                });

                parser.on('file', (att) => {
                    const fn = att.filename;
                    const isChecked = item.attachments.some(a => a.filename === fn && a.checked);
                    if (isChecked && att.data) {
                        fontFolder.file(fn, att.data);
                    }
                });

                const stream = item.fileRef.stream();
                const reader = stream.getReader();

                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        parser.write(value);
                    }
                    if (typeof parser.end === 'function') parser.end();

                    for (const [trackNo, content] of Object.entries(subtitleBuffers)) {
                        const t = item.tracks.find(x => x.number == trackNo);
                        const codec = (t && t.codec ? t.codec : '').toUpperCase();
                        const ext = (codec.includes('ASS') || codec.includes('SSA')) ? 'ass' : 'srt';
                        const lang = t && t.language ? `_${t.language}` : '';
                        const outputFilename = `${baseName}_track${trackNo}${lang}.${ext}`;
                        
                        zip.file(outputFilename, content);
                        writeLog(`- Tersimpan sub: ${outputFilename}`);
                    }
                } catch (err) {
                    writeLog(`❌ Error streaming: ${err.message}`);
                }

                resolve();
            });
        }
    </script>
